name: Build & Release Multiplateforme (Windows, Linux, macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: SteamBigPictureManager-Windows.exe
            sep: ';'
          - os: ubuntu-22.04
            artifact_name: SteamBigPictureManager-Linux
            sep: ':'
          - os: macos-latest
            artifact_name: SteamBigPictureManager-macOS
            sep: ':'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend Bundle
        run: npm run build

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build Standalone Binary (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m PyInstaller --noconsole --onefile --clean --name="SteamBigPictureManager-Windows" --add-data "dist;dist" run_app.py

      - name: Build Standalone Binary (Linux / Steam Deck)
        if: runner.os == 'Linux'
        run: |
          python3 -m PyInstaller --noconsole --onefile --clean --name="SteamBigPictureManager-Linux" --add-data "dist:dist" run_app.py
          chmod +x dist/SteamBigPictureManager-Linux
          tar -czvf dist/SteamBigPictureManager-Linux.tar.gz -C dist SteamBigPictureManager-Linux

      - name: Build Standalone Binary (macOS)
        if: runner.os == 'macOS'
        run: |
          python3 -m PyInstaller --noconsole --onefile --clean --name="SteamBigPictureManager-macOS" --add-data "dist:dist" run_app.py
          chmod +x dist/SteamBigPictureManager-macOS
          zip -j dist/SteamBigPictureManager-macOS.zip dist/SteamBigPictureManager-macOS

      - name: Upload Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/SteamBigPictureManager-Windows.exe
            dist/SteamBigPictureManager-Linux.tar.gz
            dist/SteamBigPictureManager-Linux
            dist/SteamBigPictureManager-macOS.zip
            dist/SteamBigPictureManager-macOS
          name: Release ${{ github.ref_name }} - Steam Big Picture Manager
          draft: false
          prerelease: false
          generate_release_notes: true
