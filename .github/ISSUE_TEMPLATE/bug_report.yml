name: "🐛 Rapport de Bug / Problème"
description: "Signaler un bug, un dysfonctionnement ou une erreur lors de l'utilisation."
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de prendre le temps de signaler ce bug ! Merci de renseigner un maximum de détails pour faciliter la reproduction et la correction.

  - type: dropdown
    id: os
    attributes:
      label: "Système d'Exploitation"
      description: "Sur quel OS rencontrez-vous le problème ?"
      options:
        - "Windows 10 / 11"
        - "SteamOS / Steam Deck (Mode Gaming)"
        - "SteamOS / Steam Deck (Mode Bureau)"
        - "Linux (Ubuntu / Fedora / Arch / Autre)"
        - "Linux (Flatpak Steam)"
        - "macOS"
    validations:
      required: true

  - type: dropdown
    id: installation_type
    attributes:
      label: "Mode d'Exécution"
      description: "Comment lancez-vous Steam Big Picture Manager ?"
      options:
        - "Exécutable autonome (.exe / .tar.gz / .zip)"
        - "Depuis les sources (python run_app.py / run.bat / run.sh)"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Description du Problème"
      description: "Que s'est-il passé exactement ?"
      placeholder: "L'animation refuse de s'activer après le téléchargement..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: "Étapes pour Reproduire le Bug"
      description: "Indiquez les étapes précises :"
      value: |
        1. Lancer l'application
        2. Cliquer sur '...'
        3. Constater l'erreur
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Comportement Attendu"
      description: "Que devait-il se passer normalement ?"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "Logs ou Messages d'Erreur (Optionnel)"
      description: "Collez ici les sorties terminal ou messages d'erreur de la console."
      render: shell
